        fill="none" stroke="#f2ead7" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <!-- handle -->
  <path d="M356 170 Q400 170 400 230 Q400 290 356 290"
        fill="none" stroke="url(#brass)" stroke-width="14" stroke-linecap="round"/>
  <!-- beer level line -->
