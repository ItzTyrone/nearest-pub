<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1a3324"/>
      <stop offset="1" stop-color="#0b1a12"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d98a"/>
      <stop offset="0.5" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#7a5a1f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- pint glass -->
  <path d="M156 120 L176 360 Q178 384 202 384 L310 384 Q334 384 336 360 L356 120 Z"
        fill="none" stroke="url(#brass)" stroke-width="14" stroke-linejoin="round"/>
  <!-- foam -->
