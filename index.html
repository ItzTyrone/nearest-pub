<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a12">
<meta name="description" content="Points you at the nearest pub. A compass that rotates to the closest pub around you.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nearest Pub">
<title>Nearest Pub</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">Nearest Pub</h1>
      <div class="top-actions">
        <button id="btn-enable-compass" class="chip" hidden>Enable compass</button>
        <button id="btn-list" class="iconbtn" aria-label="Show nearby pubs" title="Nearby pubs">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <div class="dial" id="dial">
        <svg class="rose" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="ring-outer" cx="120" cy="120" r="112"/>
          <circle class="ring-inner" cx="120" cy="120" r="96"/>
          <g class="ticks">
            <!-- 12 ticks -->
          </g>
          <text class="cardinal n" x="120" y="26" text-anchor="middle">N</text>
          <text class="cardinal e" x="218" y="126" text-anchor="middle">E</text>
          <text class="cardinal s" x="120" y="226" text-anchor="middle">S</text>
          <text class="cardinal w" x="22" y="126" text-anchor="middle">W</text>
        </svg>

        <div class="needle-wrap" id="needleWrap" style="transform:rotate(0deg)">
          <svg class="needle" viewBox="0 0 80 200" aria-hidden="true">
            <defs>
              <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f0d98a"/>
                <stop offset="0.5" stop-color="#c9a24b"/>
                <stop offset="1" stop-color="#7a5a1f"/>
              </linearGradient>
            </defs>
            <path d="M40 14 L62 128 L40 112 L18 128 Z" fill="url(#brass)" stroke="#3a2a0e" stroke-width="1.2"/>
            <circle cx="40" cy="138" r="7" fill="#1a1408" stroke="#c9a24b" stroke-width="2"/>
            <circle cx="40" cy="138" r="2.5" fill="#c9a24b"/>
          </svg>
        </div>

        <div class="center">
          <div class="distance" id="distance">--</div>
          <div class="dist-unit" id="distUnit">metres</div>
          <div class="pubname" id="pubName">Finding you…</div>
          <div class="walk" id="walk"></div>
        </div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Locating…</div>
      <div class="hint" id="hint"></div>
    </main>

    <nav class="bottom">
      <button id="btn-prev" class="navbtn" aria-label="Previous pub">‹</button>
      <button id="btn-next" class="navbtn" aria-label="Next pub">›</button>
      <button id="btn-go" class="gobtn" disabled>Walk there</button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-handle"></div>
    <h2>Nearby pubs</h2>
    <ul id="list" class="list"></ul>
  </div>
  <div id="backdrop" class="backdrop" hidden></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <div class="modal-actions">
        <button id="modalPrimary" class="gobtn">OK</button>
        <button id="modalSecondary" class="navbtn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
